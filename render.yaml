services:
  # Backend FastAPI Service (Docker with ffmpeg + yt-dlp)
  - type: web
    name: tubevault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: FILE_TTL_MINUTES
        value: "15"
      - key: ALLOWED_ORIGINS
        value: "*"

  # Frontend React SPA
  - type: web
    name: tubevault-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: tubevault-backend
          property: host
