version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - TEMP_DIR=/app/downloads
      - MAX_FILE_SIZE_MB=500
      - FILE_TTL_MINUTES=15
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - media_data:/app/downloads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_data:
